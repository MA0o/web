<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo — Mateo</title>
  <link rel="icon" type="image/jpeg" href="/img/perfil.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; }

    @media (max-width: 900px) { #cursor-dot { display: none; } }

    /* GALLERY */
    .gallery {
      padding-top: 3.6rem;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0;
    }

    @media (max-width: 900px) {
      .gallery { grid-template-columns: repeat(3, 1fr); }
    }

    .gallery img {
      width: 100%;
      display: block;
    }

    .anim-cell {
      overflow: hidden;
    }

    .anim-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    nav a[data-i18n="nav-cv"] { display: none; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav-projects">1. Proyectos</a>
      <a href="about.html" data-i18n="nav-about">2. About</a>
      <a href="archivo.html" data-i18n="nav-archivo">3. Archivo</a>
      <a href="cv.html" id="cv-link" data-i18n="nav-cv">4. CV</a>
      <a href="contact.html" data-i18n="nav-contact">4. Contact</a>
    </div>
    <div class="nav-lang">
      <a href="#" class="lang-link" data-lang="es">ESP</a>
      <a href="#" class="lang-link" data-lang="en">ENG</a>
      <a href="#" class="lang-link" data-lang="ca">CAT</a>
    </div>
  </nav>

  <div class="gallery">
    <div class="anim-cell" id="anim-tiketa" style="aspect-ratio: 693/1600"></div>
    <div class="anim-cell" id="anim-nanja" style="aspect-ratio: 821/1600"></div>
    <img src="img/archivo/IMG-20251112-WA0001.jpg" alt="">
    <img src="img/archivo/IMG-20251112-WA0003.jpg" alt="">
    <img src="img/archivo/IMG-20251219-WA0011.jpg" alt="">
    <img src="img/archivo/NEW TREND 2.png" alt="">
    <img src="img/archivo/WERN.png" alt="">
  </div>

  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-about': '2. Sobre mí', 'nav-archivo': '3. Archivo', 'nav-cv': '4. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-about': '2. About', 'nav-archivo': '3. Archive', 'nav-cv': '4. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-about': '2. Sobre mi', 'nav-archivo': '3. Arxiu', 'nav-cv': '4. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>

  <script>
    (function () {
      const anims = [
        { id: 'anim-tiketa', frames: ['img/archivo/tiketa1.jpeg', 'img/archivo/tiketa2.jpeg', 'img/archivo/tiketa3.jpeg'] },
        { id: 'anim-nanja',  frames: ['img/archivo/nanja1.jpeg',  'img/archivo/nanja2.jpeg',  'img/archivo/nanja3.jpeg']  },
      ];
      anims.forEach(({ id, frames }) => {
        const cell = document.getElementById(id);
        if (!cell) return;
        const img = document.createElement('img');
        img.src = frames[0];
        img.alt = '';
        cell.appendChild(img);
        frames.forEach(src => { new Image().src = src; });
        let idx = 0;
        setInterval(() => { idx = (idx + 1) % frames.length; img.src = frames[idx]; }, 500);
      });
    })();
  </script>

  <script src="js/contact.js"></script>

</body>
</html>
