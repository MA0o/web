<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivo — Mateo</title>
  <link rel="icon" type="image/jpeg" href="/img/perfil.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      min-height: 4.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; -webkit-mask: none; mask: none; }

    @media (max-width: 900px) { #cursor-dot { display: none; } }

    /* GALLERY */
    .gallery {
      margin-top: 5rem;
      opacity: 0;
      transition: opacity 0.15s;
      position: relative;
    }

    .anim-cell { overflow: hidden; }

    .anim-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    /* CURSOR LOADER STATE */
    @property --loader-a {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes loader-sectors {
      to { --loader-a: 360deg; }
    }

    #cursor-dot.loading {
      border-radius: 50%;
      background: conic-gradient(red var(--loader-a), transparent 0deg);
      animation: loader-sectors 1.2s steps(12, end) infinite;
    }

    /* TOOLTIP */
    #arch-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 500;
      background: #000;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.5;
      padding: 0.3em 0.5em;
      display: none;
      white-space: nowrap;
    }

    nav a[data-i18n="nav-cv"] { display: none; }


    .nav-links { align-self: flex-end; }

    .nav-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 100%;
      width: auto;
      display: block;
    }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="484c804e-9f54-4df9-b48e-1540f3366b36"></script>
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav-projects">1. Proyectos</a>
      <a href="about.html" data-i18n="nav-about">2. About</a>
      <a href="archivo.html" data-i18n="nav-archivo">3. Archivo</a>
      <a href="cv.html" id="cv-link" data-i18n="nav-cv">4. CV</a>
    </div>
    <img src="/img/logo-bnw.png" alt="" class="nav-logo">
    <div class="nav-lang">
      <a href="#" class="lang-link" data-lang="es">ESP</a>
      <a href="#" class="lang-link" data-lang="en">ENG</a>
      <a href="#" class="lang-link" data-lang="ca">CAT</a>
    </div>
  </nav>

  <div class="gallery">
    <div class="anim-cell" id="anim-etiqueta" style="aspect-ratio: 693/1600"></div>
    <div class="anim-cell" id="anim-naranja"  style="aspect-ratio: 821/1600"></div>
    <div class="anim-cell" id="anim-hoja"     style="aspect-ratio: 750/1334"></div>
    <img src="img/archivo/thumbs/2025.jpg"                        data-full="img/archivo/2025.png" alt="">
    <img src="img/archivo/thumbs/flatblcock_grafica_2026.jpg"     data-full="img/archivo/flatblock_grafica_2026.jpg" alt="">
    <img src="img/archivo/thumbs/grafica_2025.jpg"                data-full="img/archivo/grafica_2025.jpg" alt="">
    <img src="img/archivo/thumbs/poster_2025-j.jpg"               data-full="img/archivo/poster_2025.jpg" alt="">
    <img src="img/archivo/thumbs/poster_2025-p.jpg"               data-full="img/archivo/poster_2025.png" alt="">
    <img src="img/archivo/thumbs/flatblock_2026.jpg"              data-full="img/archivo/flatblock_2026.jpg" alt="">
    <img src="img/archivo/thumbs/maquetas_2026.jpg"               data-full="img/archivo/maquetas_2026.webp" alt="">
    <img src="img/archivo/thumbs/comida_2024.jpg"                 data-full="img/archivo/comida_2024.jpg" alt="">
    <img src="img/archivo/thumbs/pared_2026.jpg"                  data-full="img/archivo/pared_2026.jpg" alt="">
    <img src="img/archivo/thumbs/1x1_2024.jpg"                    data-full="img/archivo/1x1_2024.jpg" alt="">
  </div>

  <div id="arch-tooltip"></div>
  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a, .nav-logo')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a, .nav-logo')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-about': '2. Sobre mí', 'nav-archivo': '3. Archivo', 'nav-cv': '4. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-about': '2. About', 'nav-archivo': '3. Archive', 'nav-cv': '4. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-about': '2. Sobre mi', 'nav-archivo': '3. Arxiu', 'nav-cv': '4. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>

  <script>
    // Animations: cycling frames at 500ms
    (function () {
      const T = 'img/archivo/thumbs/';
      const anims = [
        { id: 'anim-etiqueta', frames: [T+'letras en una etiqueta_20251.jpg', T+'letras en una etiqueta_20252.jpg', T+'letras en una etiqueta_20253.jpg'] },
        { id: 'anim-naranja',  frames: [T+'letras en una naranja_20251.jpg',  T+'letras en una naranja_20252.jpg',  T+'letras en una naranja_20253.jpg']  },
        { id: 'anim-hoja',     frames: ['img/archivo/letras en una hoja_20251.jpg','img/archivo/letras en una hoja_20252.jpg','img/archivo/letras en una hoja_20253.jpg','img/archivo/letras en una hoja_20254.jpg','img/archivo/letras en una hoja_20255.jpg'] },
      ];
      anims.forEach(({ id, frames }) => {
        const cell = document.getElementById(id);
        if (!cell) return;
        const img = document.createElement('img');
        img.src = frames[0];
        img.alt = '';
        cell.appendChild(img);
        frames.forEach(src => { new Image().src = src; });
        let idx = 0;
        setInterval(() => { idx = (idx + 1) % frames.length; img.src = frames[idx]; }, 500);
      });
    })();
  </script>

  <script>
    // Constellation layout — same algorithm as index.html
    (function () {
      const gallery = document.querySelector('.gallery');
      if (!gallery) return;

      const dot = document.getElementById('cursor-dot');
      const rawItems = [...gallery.children];

      function getAspect(el) {
        if (el.tagName === 'IMG') {
          if (el.naturalWidth && el.naturalHeight) return el.naturalHeight / el.naturalWidth;
          return 4 / 3;
        }
        const ar = el.style.aspectRatio;
        if (ar && ar.includes('/')) {
          const [n, d] = ar.split('/').map(Number);
          return d / n;
        }
        return 1;
      }

      function build() {
        const W = gallery.clientWidth;

        const mobile = window.innerWidth < 900;
        const COL_W = W / 5 * 1.1 * (mobile ? 1.5 : 1);
        const GAP = 6;

        const items = rawItems.map(el => {
          const aspect = getAspect(el);
          return { el, w: COL_W, h: COL_W * aspect };
        });

        const COLS = 5;
        const AVG_H = items.reduce((s, it) => s + it.h, 0) / items.length;
        const ROW_H = AVG_H * 1.8 + GAP * 4;
        const JX = COL_W * 3.0;
        const JY = ROW_H * 1.2;

        const placed = [];

        function overlaps(ax, ay, aw, ah) {
          for (const p of placed) {
            if (ax + aw + GAP > p.x && ax < p.x + p.w + GAP &&
                ay + ah + GAP > p.y && ay < p.y + p.h + GAP) return true;
          }
          return false;
        }

        items.forEach(({ el, w, h }, i) => {
          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const baseX = col * (W / COLS) + (W / COLS - w) / 2;
          const baseY = row * ROW_H;

          let bx = baseX, by = baseY;

          for (let t = 0; t < 150; t++) {
            const s = Math.min(t * 0.12 + 1, 3.5);
            const rx = (Math.random() * 2 - 1) * JX * s;
            const ry = (Math.random() * 2 - 1) * JY * s;
            const cx = Math.max(GAP, Math.min(W - w - GAP, baseX + rx));
            const cy = Math.max(GAP, baseY + ry);
            if (!overlaps(cx, cy, w, h)) { bx = cx; by = cy; break; }
          }

          placed.push({ x: bx, y: by, w, h });
          el.style.position = 'absolute';
          el.style.left   = Math.round(bx) + 'px';
          el.style.top    = Math.round(by) + 'px';
          el.style.width  = Math.round(w)  + 'px';
          el.style.height = Math.round(h)  + 'px';
        });

        const totalH = placed.reduce((m, p) => Math.max(m, p.y + p.h), 0);
        gallery.style.height = Math.round(totalH + 32) + 'px';
        gallery.style.opacity = '1';
        lastBuiltW = W;
        if (dot) dot.classList.remove('loading');
      }

      if (dot) dot.classList.add('loading');

      const imgs = rawItems.filter(el => el.tagName === 'IMG');
      let done = 0;
      const check = () => { if (++done >= imgs.length) build(); };
      if (!imgs.length) { build(); }
      else imgs.forEach(img => {
        if (img.complete) check();
        else {
          img.addEventListener('load',  check, { once: true });
          img.addEventListener('error', check, { once: true });
        }
      });

      let resizeTimer;
      let lastBuiltW = 0;
      window.addEventListener('resize', () => {
        const newW = gallery.clientWidth;
        if (Math.abs(newW - lastBuiltW) < 4) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          rawItems.forEach(el => {
            el.style.position = '';
            el.style.left     = '';
            el.style.top      = '';
            el.style.width    = '';
            el.style.height   = '';
          });
          gallery.style.height  = '';
          gallery.style.opacity = '0';
          build();
        }, 200);
      });
    })();
  </script>

  <script>
    // Hover tooltip: parse nombre / tipo / año from filename
    (function () {
      const tooltip = document.getElementById('arch-tooltip');
      const gallery = document.querySelector('.gallery');
      if (!tooltip || !gallery) return;

      function parse(el) {
        let base = '';
        if (el.tagName === 'IMG') {
          const src = el.dataset.full || el.src;
          base = src.split('/').pop().replace(/\.[^.]+$/, '');
        } else {
          base = (el.id || '').replace('anim-', '');
        }
        const p = base.split('_');
        return [p[0] || '', p[1] || '', p[2] || ''];
      }

      let current = null;

      gallery.addEventListener('mousemove', e => {
        const item = e.target.closest && e.target.closest('.gallery > img, .gallery > .anim-cell');
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top  = (e.clientY - 10) + 'px';
        if (item) {
          if (item !== current) {
            current = item;
            const [n, t, y] = parse(item);
            tooltip.innerHTML = `${n}<br>${t}<br>${y}`;
          }
          tooltip.style.display = 'block';
        } else {
          current = null;
          tooltip.style.display = 'none';
        }
      });

      gallery.addEventListener('mouseleave', () => {
        current = null;
        tooltip.style.display = 'none';
      });

    })();
  </script>
  <script src="js/viewer.js"></script>
  <script src="/js/nav5.js"></script>
</body>
</html>
