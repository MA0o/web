<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1x1 — Mateo</title>
  <link rel="icon" type="image/svg+xml" href="../icons/fabicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }
    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }
    @media (max-width: 800px) { nav { font-size: 1rem; } }
    * { cursor: none; }
    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }
    #cursor-dot.square { border-radius: 0; }
    @media (max-width: 900px) { #cursor-dot { display: none; } }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
      .title-corner {
      position: fixed;
      bottom: 0;
      z-index: 100;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      padding: 0.12rem 0.5rem;
      pointer-events: none;
      line-height: 1.1;
    }
    .title-corner-left  { left: 0; }
    .title-corner-right { right: 0; }
      nav a[data-i18n="nav-cv"] { display: none; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-links">
      <a href="../index.html" data-i18n="nav-projects">1. Proyectos</a>
      <a href="../about.html" data-i18n="nav-about">2. About</a>
      <a href="../cv.html" data-i18n="nav-cv">3. CV</a>
      <a href="../contact.html" data-i18n="nav-contact">4. Contact</a>
    </div>
    <div class="nav-lang">
      <a href="#" class="lang-link" data-lang="es">ESP</a>
      <a href="#" class="lang-link" data-lang="en">ENG</a>
      <a href="#" class="lang-link" data-lang="ca">CAT</a>
    </div>
  </nav>
  <div class="placeholder">
    <span>1x1</span>
  </div>
  <div class="title-corner title-corner-left">1x1</div>
  <div class="title-corner title-corner-right">1x1</div>

  <div id="cursor-dot"></div>
  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-about': '2. Sobre mí', 'nav-cv': '3. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-about': '2. About', 'nav-cv': '3. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-about': '2. Sobre mi', 'nav-cv': '3. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>
  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
    });
    document.querySelectorAll('nav a').forEach(a => {
      a.addEventListener('mouseenter', () => dot.classList.add('square'));
      a.addEventListener('mouseleave', () => dot.classList.remove('square'));
    });
  </script>
</body>
</html>
