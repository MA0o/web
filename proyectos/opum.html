  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; }

    @media (max-width: 900px) { #cursor-dot { display: none; } }

    /* CAROUSELS */
    .carousel-wrap {
      padding-top: 3.5rem;
      pointer-events: none;
    }

    .carousel-row {
      height: 25vh;
      overflow: hidden;
      display: flex;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      flex-shrink: 0;
      will-change: transform;
    }

    .carousel-track img {
      height: 100%;
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    @keyframes scroll-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @keyframes scroll-right {
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    .track-left  { animation: scroll-left  90s linear infinite; }
    .track-right { animation: scroll-right 90s linear infinite; }

    /* TITLE CORNERS */
    .title-corner {
      position: fixed;
      bottom: 0;
      z-index: 110;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      padding: 0.12rem 0.5rem;
      pointer-events: none;
      line-height: 1.1;
    }
    .title-corner-left  { left: 0; }
    .title-corner-right { right: 0; }

    nav a[data-i18n="nav-cv"] { display: none; }
  </style>

  <div class="title-corner title-corner-left">OPUM</div>
  <div class="title-corner title-corner-right">OPUM</div>

  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-about': '2. Sobre mí', 'nav-cv': '3. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-about': '2. About', 'nav-cv': '3. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-about': '2. Sobre mi', 'nav-cv': '3. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>

  <script src="../js/contact.js"></script>
