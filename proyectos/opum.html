  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      height: 100vh;
      overflow: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; }

    #cursor-dot.cross {
      border-radius: 0;
      clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
      transform: translate(-50%, -50%) rotate(45deg);
    }

    #cursor-info {
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      width: 12rem;
      background: transparent;
      color: #000;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      line-height: 1.4;
      text-align: center;
      transform: translate(-50%, calc(-100% - 14px));
      display: none;
    }
    #cursor-info strong { display: block; font-weight: 700; margin-bottom: 0.25em; }
    #cursor-info span   { display: block; }

    @media (max-width: 900px) { #cursor-dot { display: none; } #cursor-info { display: none !important; } }

    /* OVERLAY */
    #img-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      overflow: hidden;
    }
    #img-overlay.open { display: block; }
    #img-overlay img {
      position: absolute;
      height: 140vh;
      width: auto;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* CAROUSELS */
    .carousel-wrap {
      padding-top: 3.5rem;
      height: 100vh;
    }

    .carousel-track img {
      pointer-events: none;
    }

    .carousel-row {
      height: calc((100vh - 3.5rem) / 4.5);
      display: flex;
      align-items: center;
      overflow: visible;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      flex-shrink: 0;
      align-items: center;
      will-change: transform;
    }

    .carousel-track img {
      height: calc((100vh - 3.5rem) / 2.25);
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    /* desfase 0.5 imagen entre filas 1↔3 y 2↔4 */
    .carousel-row:nth-child(3) .carousel-track,
    .carousel-row:nth-child(4) .carousel-track {
      animation-delay: calc(-120s / 218);
    }

    @keyframes scroll-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @keyframes scroll-right {
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    .track-left  { animation: scroll-left  120s linear infinite; }
    .track-right { animation: scroll-right 120s linear infinite; }

    /* TITLE CORNERS */
    .title-corner {
      position: fixed;
      bottom: 0;
      z-index: 110;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      padding: 0.12rem 0.5rem;
      pointer-events: none;
      line-height: 1.1;
    }
    .title-corner-left  { left: 0; }
    .title-corner-right { right: 0; }

    nav a[data-i18n="nav-cv"] { display: none; }
  </style>

  <div class="title-corner title-corner-left">OPUM</div>
  <div class="title-corner title-corner-right">OPUM</div>

  <div id="img-overlay"><img id="overlay-img" src="" alt=""></div>

  <div id="cursor-dot"></div>
  <div id="cursor-info"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    const cursorInfo = document.getElementById('cursor-info');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
      cursorInfo.style.left = e.clientX + 'px';
      cursorInfo.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-about': '2. Sobre mí', 'nav-cv': '3. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-about': '2. About', 'nav-cv': '3. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-about': '2. Sobre mi', 'nav-cv': '3. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>

  <script>
    (function () {
      const overlay    = document.getElementById('img-overlay');
      const overlayImg = document.getElementById('overlay-img');
      const dot        = document.getElementById('cursor-dot');
      const cursorInfo = document.getElementById('cursor-info');

      const alphaCanvas = document.createElement('canvas');
      const alphaCtx = alphaCanvas.getContext('2d', { willReadFrequently: true });
      let canvasReady = false;
      let overContent = false;
      let currentData = null;

      const imageData = {};
      fetch('../img/proyectos/opum/DATOS%20EMES.csv')
        .then(r => r.text())
        .then(text => {
          text.trim().split('\n').slice(1).forEach(line => {
            const p = line.split(',');
            const n = parseInt(p[0]);
            if (!isNaN(n)) imageData[n] = { nombre: p[2], texto: p[3] };
          });
        });

      function contentCenterY() {
        const w = alphaCanvas.width, h = alphaCanvas.height;
        const data = alphaCtx.getImageData(0, 0, w, h).data;
        let totalWeight = 0, weightedY = 0;
        for (let y = 0; y < h; y += 2)
          for (let x = 0; x < w; x += 2) {
            const a = data[(y * w + x) * 4 + 3];
            if (a > 50) { totalWeight += a; weightedY += y * a; }
          }
        return totalWeight > 0 ? weightedY / totalWeight / h : 0.5;
      }

      function openOverlay(srcImg) {
        canvasReady = false;
        overContent = false;
        const n = parseInt((srcImg.src.match(/emes(\d+)\.png/) || [])[1]);
        currentData = imageData[n] || null;

        // Canvas desde thumbnail (ya cargado) para alpha y centro de contenido
        alphaCanvas.width  = srcImg.naturalWidth;
        alphaCanvas.height = srcImg.naturalHeight;
        alphaCtx.clearRect(0, 0, alphaCanvas.width, alphaCanvas.height);
        alphaCtx.drawImage(srcImg, 0, 0);
        canvasReady = true;

        const cy = contentCenterY();

        const fullSrc = srcImg.src.replace('/thumbs/', '/carrousel/');
        const fullImg = new Image();
        fullImg.onload = () => {
          overlayImg.src = fullSrc;
          overlayImg.style.top = (window.innerHeight * 0.5 - cy * window.innerHeight * 1.4) + 'px';
          overlay.classList.add('open');
          if (currentData) {
            cursorInfo.innerHTML = `<strong>${currentData.nombre}</strong><span>${currentData.texto}</span>`;
            cursorInfo.style.display = 'block';
          }
          alphaCanvas.width  = fullImg.naturalWidth;
          alphaCanvas.height = fullImg.naturalHeight;
          alphaCtx.clearRect(0, 0, alphaCanvas.width, alphaCanvas.height);
          alphaCtx.drawImage(fullImg, 0, 0);
        };
        fullImg.src = fullSrc;
      }

      function setOverlayCursor() {
        dot.classList.toggle('cross', !overContent);
      }

      function closeOverlay() {
        overlay.classList.remove('open');
        overlayImg.src = '';
        overlayImg.style.top = '';
        dot.classList.remove('cross');
        cursorInfo.style.display = 'none';
        cursorInfo.innerHTML = '';
        currentData = null;
        overContent = false;
      }

      overlay.addEventListener('mousemove', (e) => {
        const rect = overlayImg.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (canvasReady && x >= 0 && y >= 0 && x < rect.width && y < rect.height) {
          const cx = Math.floor(x / rect.width  * alphaCanvas.width);
          const cy = Math.floor(y / rect.height * alphaCanvas.height);
          overContent = alphaCtx.getImageData(cx, cy, 1, 1).data[3] > 10;
        } else {
          overContent = false;
        }
        setOverlayCursor();
      });

      overlay.addEventListener('mouseleave', () => {
        dot.classList.remove('cross');
      });

      overlay.addEventListener('click', () => { if (!overContent) closeOverlay(); });
      overlay.addEventListener('touchend', (e) => { e.preventDefault(); closeOverlay(); }, { passive: false });

      const allImgs = Array.from(document.querySelectorAll('.carousel-track img'));

      function handleCarouselTap(cx, cy) {
        const candidates = allImgs.filter(img => {
          const r = img.getBoundingClientRect();
          return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
        });

        if (!candidates.length) return;

        let hit = null;
        for (const img of candidates) {
          if (!img.complete || !img.naturalWidth) continue;
          const r = img.getBoundingClientRect();
          const px = Math.floor((cx - r.left) / r.width  * img.naturalWidth);
          const py = Math.floor((cy - r.top)  / r.height * img.naturalHeight);
          const c = document.createElement('canvas');
          c.width  = img.naturalWidth;
          c.height = img.naturalHeight;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          if (ctx.getImageData(px, py, 1, 1).data[3] > 10) hit = img;
        }

        if (hit) openOverlay(hit);
      }

      document.querySelector('.carousel-wrap').addEventListener('click', (e) => {
        handleCarouselTap(e.clientX, e.clientY);
      });

      const tracks = document.querySelectorAll('.carousel-track');
      let touchStartX = 0, touchStartY = 0;
      document.querySelector('.carousel-wrap').addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        tracks.forEach(t => t.style.animationPlayState = 'paused');
      }, { passive: true });
      document.querySelector('.carousel-wrap').addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        tracks.forEach(tr => tr.style.animationPlayState = 'running');
        if (Math.abs(t.clientX - touchStartX) < 20 && Math.abs(t.clientY - touchStartY) < 20) {
          handleCarouselTap(t.clientX, t.clientY);
          e.preventDefault();
        }
      }, { passive: false });
      document.querySelector('.carousel-wrap').addEventListener('touchcancel', () => {
        tracks.forEach(t => t.style.animationPlayState = 'running');
      }, { passive: true });
    })();
  </script>
