<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPUM — Mateo</title>
  <link rel="icon" type="image/jpeg" href="/img/perfil.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      z-index: 200;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      -webkit-mask: url('../icons/cursors/cursor-flecha.svg') center / contain no-repeat;
      mask: url('../icons/cursors/cursor-flecha.svg') center / contain no-repeat;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { -webkit-mask: none; mask: none; border-radius: 0; }

    #cursor-dot.cross {
      border-radius: 0;
            -webkit-mask: none;
      mask: none;
clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
      transform: translate(-50%, -50%) rotate(45deg);
    }

    @media (max-width: 900px) { #cursor-dot { display: none; } }

    /* SCATTER */
    .scatter {
      position: relative;
      width: 100%;
    }

    .scatter img {
      position: absolute;
      height: calc((100vh - 3.5rem) / 2.25);
      width: auto;
      display: block;
    }

    .scatter img:hover { z-index: 10; }

    /* HOVER INFO */
    #cursor-dot.info {
      width: 12rem;
      height: auto;
      background: transparent;
      border-radius: 0;
      color: #000;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      line-height: 1.4;
      text-align: center;
      transform: translate(-50%, calc(-100% - 10px));
    }
    #cursor-dot.info strong { display: block; font-weight: 700; margin-bottom: 0.25em; }
    #cursor-dot.info span { display: block; }

    /* OVERLAY */
    #img-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      overflow: hidden;
    }
    #img-overlay.open { display: block; }
    #img-overlay img {
      position: absolute;
      height: 200vh;
      width: auto;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* TITLE CORNERS */
    .title-corner {
      position: fixed;
      bottom: 0;
      z-index: 110;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      padding: 0.12rem 0.5rem;
      pointer-events: none;
      line-height: 1.1;
    }
    .title-corner-left  { left: 0; }
    .title-corner-right { right: 0; }

    nav a[data-i18n="nav-cv"] { display: none; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="../index.html" data-i18n="nav-projects">1. Proyectos</a>
      <a href="../about.html" data-i18n="nav-about">2. About</a>
      <a href="../archivo.html" data-i18n="nav-archivo">3. Archivo</a>
      <a href="../cv.html" data-i18n="nav-cv">4. CV</a>
      <a href="../contact.html" data-i18n="nav-contact">4. Contact</a>
    </div>
    <div class="nav-lang">
      <a href="#" class="lang-link" data-lang="es">ESP</a>
      <a href="#" class="lang-link" data-lang="en">ENG</a>
      <a href="#" class="lang-link" data-lang="ca">CAT</a>
    </div>
  </nav>

  <div class="scatter" id="scatter"></div>

  <div id="img-overlay"><img id="overlay-img" src="" alt=""></div>

  <div class="title-corner title-corner-left">OPUM</div>
  <div class="title-corner title-corner-right">OPUM</div>

  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-archivo': '3. Archivo', 'nav-about': '2. Sobre mí', 'nav-cv': '3. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-archivo': '3. Archive', 'nav-about': '2. About', 'nav-cv': '3. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-archivo': '3. Arxiu', 'nav-about': '2. Sobre mi', 'nav-cv': '3. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>

  <script>
    // Genera y distribuye imágenes aleatoriamente
    (function () {
      const wrap = document.getElementById('scatter');
      const dot  = document.getElementById('cursor-dot');
      const overlay = document.getElementById('img-overlay');
      const nums = Array.from({ length: 110 }, (_, i) => i + 1).filter(n => n !== 103);

      // Cargar datos CSV
      const imageData = {};
      fetch('../img/proyectos/opum/DATOS%20EMES.csv')
        .then(r => r.text())
        .then(text => {
          text.trim().split('\n').slice(1).forEach(line => {
            const p = line.split(',');
            const n = parseInt(p[0]);
            if (!isNaN(n)) imageData[n] = { nombre: p[2], texto: p[3] };
          });
        });

      // Crear elementos img
      const imgs = nums.map(n => {
        const img = document.createElement('img');
        img.src = `../img/proyectos/opum/thumbs/emes${n}.png`;
        img.alt = '';
        img.dataset.n = n;
        img.addEventListener('mouseenter', () => {
          if (overlay.classList.contains('open')) return;
          const d = imageData[n];
          if (!d) return;
          dot.innerHTML = `<strong>${d.nombre}</strong><span>${d.texto}</span>`;
          dot.classList.add('info');
        });
        img.addEventListener('mouseleave', () => {
          dot.innerHTML = '';
          dot.classList.remove('info');
        });
        wrap.appendChild(img);
        return img;
      });

      function layout() {
        const W = window.innerWidth;
        const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
        const navH = rem * 3.5;
        const imgH = (window.innerHeight - navH) / 2.25;
        const imgW = imgH * (1999 / 3000);
        const GAP = 6;

        // Contenedor para ~65% de cobertura
        const totalH = Math.round(navH + imgs.length * (imgW + GAP) * (imgH + GAP) / (W * 0.65));
        wrap.style.height = totalH + 'px';

        const placed = [];
        const shuffled = [...imgs].sort(() => Math.random() - 0.5);

        for (const img of shuffled) {
          let x = Math.random() * Math.max(1, W - imgW);
          let y = navH + Math.random() * Math.max(1, totalH - navH - imgH);

          for (let attempt = 0; attempt < 500; attempt++) {
            const tx = Math.random() * Math.max(1, W - imgW);
            const ty = navH + Math.random() * Math.max(1, totalH - navH - imgH);
            x = tx; y = ty; // siempre actualizar — el fallback queda en posición aleatoria
            const ok = placed.every(([ex, ey]) =>
              Math.abs(tx - ex) >= imgW + GAP || Math.abs(ty - ey) >= imgH + GAP
            );
            if (ok) break;
          }

          img.style.left   = Math.round(x) + 'px';
          img.style.top    = Math.round(y) + 'px';
          img.style.zIndex = Math.floor(Math.random() * 5) + 1;
          placed.push([x, y]);
        }
      }

      layout();
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layout, 200);
      });
    })();
  </script>

  <script>
    // Overlay
    (function () {
      const overlay    = document.getElementById('img-overlay');
      const overlayImg = document.getElementById('overlay-img');
      const dot        = document.getElementById('cursor-dot');

      const alphaCanvas = document.createElement('canvas');
      const alphaCtx    = alphaCanvas.getContext('2d', { willReadFrequently: true });
      let canvasReady = false;
      let overContent = false;

      function contentCenterY() {
        const w = alphaCanvas.width, h = alphaCanvas.height;
        const data = alphaCtx.getImageData(0, 0, w, h).data;
        let totalWeight = 0, weightedY = 0;
        for (let y = 0; y < h; y += 2)
          for (let x = 0; x < w; x += 2) {
            const a = data[(y * w + x) * 4 + 3];
            if (a > 50) { totalWeight += a; weightedY += y * a; }
          }
        return totalWeight > 0 ? weightedY / totalWeight / h : 0.5;
      }

      function openOverlay(srcImg) {
        canvasReady = false;
        overContent = false;

        alphaCanvas.width  = srcImg.naturalWidth;
        alphaCanvas.height = srcImg.naturalHeight;
        alphaCtx.clearRect(0, 0, alphaCanvas.width, alphaCanvas.height);
        alphaCtx.drawImage(srcImg, 0, 0);
        canvasReady = true;

        const cy = contentCenterY();

        const fullSrc = srcImg.src.replace('/thumbs/', '/carrousel/');
        const fullImg = new Image();
        fullImg.onload = () => {
          overlayImg.src = fullSrc;
          overlayImg.style.top = (window.innerHeight * 0.5 - cy * window.innerHeight * 2) + 'px';
          overlay.classList.add('open');
          alphaCanvas.width  = fullImg.naturalWidth;
          alphaCanvas.height = fullImg.naturalHeight;
          alphaCtx.clearRect(0, 0, alphaCanvas.width, alphaCanvas.height);
          alphaCtx.drawImage(fullImg, 0, 0);
        };
        fullImg.src = fullSrc;
      }

      function closeOverlay() {
        overlay.classList.remove('open');
        overlayImg.src = '';
        overlayImg.style.top = '';
        dot.classList.remove('cross');
        overContent = false;
      }

      overlay.addEventListener('mousemove', (e) => {
        const rect = overlayImg.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (canvasReady && x >= 0 && y >= 0 && x < rect.width && y < rect.height) {
          const cx = Math.floor(x / rect.width  * alphaCanvas.width);
          const cy = Math.floor(y / rect.height * alphaCanvas.height);
          overContent = alphaCtx.getImageData(cx, cy, 1, 1).data[3] > 10;
        } else {
          overContent = false;
        }
        dot.classList.toggle('cross', !overContent);
      });

      overlay.addEventListener('mouseleave', () => dot.classList.remove('cross'));
      overlay.addEventListener('click', () => { if (!overContent) closeOverlay(); });

      document.getElementById('scatter').addEventListener('click', (e) => {
        const img = e.target.closest('img');
        if (img) { e.stopPropagation(); openOverlay(img); }
      });
    })();
  </script>

  <script src="../js/contact.js"></script>

</body>
</html>
