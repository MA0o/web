  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      min-height: 4.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; -webkit-mask: none; mask: none; }

    @media (max-width: 900px) { #cursor-dot { display: none; } }

    /* GALLERY */
    .gallery {
      padding-top: 3.6rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
    }

    @media (max-width: 900px) {
      .gallery { grid-template-columns: repeat(3, 1fr); }
    }

    .gallery img {
      width: 100%;
      display: block;
    }

    /* RGBO ANIMATIONS */
    .rgbo-section {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;
      padding-top: 5rem;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .rgbo-section { grid-template-columns: repeat(2, 1fr); }
    }

    .rgbo-cell {
      aspect-ratio: 2 / 3;
      overflow: hidden;
    }

    .rgbo-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* TITLE CORNERS */
    .title-corner {
      position: fixed;
      bottom: 0;
      z-index: 110;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      padding: 0.12rem 0.5rem;
      min-height: 4.5rem;
      pointer-events: none;
      line-height: 1.1;
    }
    .title-corner-left  { left: 0; }
    .title-corner-right { right: 0; }

    nav a[data-i18n="nav-cv"] { display: none; }

    .nav-links { align-self: flex-end; }

    .nav-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 100%;
      width: auto;
      display: block;
    }
  </style>

  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a, .nav-logo')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a, .nav-logo')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-archivo': '3. Archivo', 'nav-about': '2. Sobre mí', 'nav-cv': '3. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-archivo': '3. Archive', 'nav-about': '2. About', 'nav-cv': '3. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-archivo': '3. Arxiu', 'nav-about': '2. Sobre mi', 'nav-cv': '3. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>

  <script>
    (function () {
      const base = '../img/proyectos/mmmm/';
      const anims = [
        { id: 'rgbo-r', dir: 'R', files: ['_MP_3496.jpg','_MP_3501.jpg','_MP_3507.jpg','_MP_3517.jpg','_MP_3520.jpg','_MP_3525.jpg','_MP_3529.jpg','_MP_3532.jpg','_MP_3535.jpg','_MP_3671.jpg','_MP_3679.jpg'] },
        { id: 'rgbo-g', dir: 'G', files: ['_MP_3537.jpg','_MP_3540.jpg','_MP_3547.jpg','_MP_3549.jpg','_MP_3551.jpg','_MP_3555.jpg','_MP_3559.jpg','_MP_3563.jpg','_MP_3654.jpg','_MP_3660.jpg','_MP_3665.jpg'] },
        { id: 'rgbo-b', dir: 'B', files: ['_MP_3494.jpg','_MP_3682.jpg','_MP_3687.jpg','_MP_3691.jpg','_MP_3697.jpg','_MP_3700.jpg','_MP_3702.jpg','_MP_3706.jpg','_MP_3715.jpg'] },
        { id: 'rgbo-o', dir: 'O', files: ['_MP_3569.jpg','_MP_3574.jpg','_MP_3576.jpg','_MP_3579.jpg','_MP_3581.jpg','_MP_3583.jpg','_MP_3591.jpg','_MP_3597.jpg','_MP_3606.jpg','_MP_3628.jpg','_MP_3636.jpg','_MP_3647.jpg'] },
      ];

      anims.forEach(({ id, dir, files }) => {
        const cell = document.getElementById(id);
        if (!cell) return;
        const srcs = files.map(f => `${base}${dir}/thumbs/${f}`);

        const img = document.createElement('img');
        img.src = srcs[0];
        img.alt = '';
        cell.appendChild(img);

        srcs.forEach(src => { new Image().src = src; });

        let idx = 0;
        setInterval(() => {
          idx = (idx + 1) % srcs.length;
          img.src = srcs[idx];
        }, 200);
      });
    })();
  </script>
