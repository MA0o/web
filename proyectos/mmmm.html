<!DOCTYPE html>

<head>

  <title>MMMM — Mateo</title>
  <link rel="icon" type="image/jpeg" href="/img/perfil.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }

    @media (max-width: 800px) { nav { font-size: 1rem; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10002;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; }

    @media (max-width: 900px) { #cursor-dot { display: none; } }

    /* GALLERY */
    .gallery {
      padding-top: 3.6rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .gallery img {
      width: 100%;
      display: block;
    }

    /* TITLE CORNERS */
    .title-corner {
      position: fixed;
      bottom: 0;
      z-index: 110;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      padding: 0.12rem 0.5rem;
      pointer-events: none;
      line-height: 1.1;
    }
    .title-corner-left  { left: 0; }
    .title-corner-right { right: 0; }

    nav a[data-i18n="nav-cv"] { display: none; }
  </style>
</head>
<body>

  <div id="cursor-dot"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseover', e => {
      if (e.target.closest('a')) dot.classList.add('square');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('a')) dot.classList.remove('square');
    });
  </script>

  <script>
    const translations = {
      es: { 'nav-projects': '1. Proyectos', 'nav-about': '2. Sobre mí', 'nav-cv': '3. CV', 'nav-contact': '4. Contacto' },
      en: { 'nav-projects': '1. Projects', 'nav-about': '2. About', 'nav-cv': '3. CV', 'nav-contact': '4. Contact' },
      ca: { 'nav-projects': '1. Projectes', 'nav-about': '2. Sobre mi', 'nav-cv': '3. CV', 'nav-contact': '4. Contacte' },
    };
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = translations[lang] && translations[lang][el.dataset.i18n];
        if (val !== undefined) el.innerHTML = val;
      });
      document.querySelectorAll('.lang-link').forEach(a => {
        a.classList.toggle('active', a.dataset.lang === lang);
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-link').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); applyLang(a.dataset.lang); });
    });
    applyLang(localStorage.getItem('lang') || 'es');
  </script>
