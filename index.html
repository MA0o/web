  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
      --gutter: 0.3rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.12rem 0.5rem;
      min-height: 4.5rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    nav a {
      display: block;
      width: fit-content;
      color: #000000;
      text-decoration: none;
    }

    .cv-entry a {
      color: inherit;
      text-decoration: none;
    }

    .nav-lang {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .lang-link { opacity: 0.4; }
    .lang-link.active { opacity: 1; }


    /* MAIN */
    main {
      padding-top: 5rem;
      padding-left: 1rem;
      padding-right: 1rem;
      padding-bottom: 4rem;
    }

    /* GRID */
    .grid {
      columns: 5;
      column-gap: var(--gutter);
      opacity: 0;
      transition: opacity 0.2s;
    }

    figure.project {
      break-inside: avoid;
      margin-bottom: var(--gutter);
      display: block;
    }

    figure.project a {
      display: block;
      text-decoration: none;
    }

    .thumb {
      display: block;
      width: 100%;
      background-color: white;
      transition: filter 0.5s ease;
    }

    figure.project a:hover .thumb {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
    }

    figure.project[data-wip]:hover .thumb {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
    }

    .deco { width: 100%; height: 220px; background: #e0e0e0; }

    /* RESPONSIVE */
    @media (max-width: 1100px) { .grid { columns: 4; } }
    @media (max-width: 800px) {
      .grid { columns: 3; margin-right: 0; column-gap: 0; }
      main { padding-left: 0; padding-right: 0; padding-top: 4.5rem; }
      nav { font-size: 1rem; }
      figure.project { margin-bottom: 0; }
    }
    @media (max-width: 500px) { .grid { columns: 1; } }

    /* CURSOR LOADER STATE */
    @property --loader-a {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes loader-sectors {
      to { --loader-a: 360deg; }
    }

    #cursor-dot.loading {
      border-radius: 50%;
      background: conic-gradient(red var(--loader-a), transparent 0deg);
      animation: loader-sectors 1.2s steps(12, end) infinite;
    }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: border-radius 0.15s ease;
    }

    #cursor-dot.square { border-radius: 0; -webkit-mask: none; mask: none; }

    #cursor-dot.triangle-right {
      border-radius: 0;
      -webkit-mask: url('icons/cursors/cursor-triangle-right.svg') center / contain no-repeat;
      mask: url('icons/cursors/cursor-triangle-right.svg') center / contain no-repeat;
    }

    #cursor-dot.triangle-left {
      border-radius: 0;
      -webkit-mask: url('icons/cursors/cursor-triangle-left.svg') center / contain no-repeat;
      mask: url('icons/cursors/cursor-triangle-left.svg') center / contain no-repeat;
    }

    #cursor-dot.cross {
      border-radius: 0;
      -webkit-mask: none;
      mask: none;
      clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
      transform: translate(-50%, -50%) rotate(45deg);
    }

    #cursor-dot.plus {
      border-radius: 0;
      -webkit-mask: none;
      mask: none;
      clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
    }

    #cursor-label {
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.5;
      background: #000;
      color: #fff;
      padding: 0.3em 0.5em;
      white-space: nowrap;
      display: none;
    }

    #cursor-label.active { display: block; }

    @media (max-width: 900px) {
      #cursor-dot, #cursor-label { display: none; }
    }

    /* CV OVERLAY */
    .cv-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
    }

    .cv-overlay.open { display: block; }

    body.cv-open { overflow: hidden; }

    .cv-box {
      position: absolute;
      top: 1rem;
      left: 6rem;
      right: 6rem;
      bottom: 6rem;
      background: #05ff00;
      --text: rgba(0, 0, 0, 0.85);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .cv-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.3em;
      flex: 0 0 auto;
    }

    .cv-title {
      font-family: var(--font-mono);
      font-size: 6.4em;
      font-weight: 400;
      line-height: 1.2;
    }

    .cv-close {
      color: var(--text);
      text-decoration: none;
      display: block;
    }

    .cv-close svg {
      width: 5.2em;
      height: 5.2em;
      display: block;
    }

    .cv-arrow {
      display: inline-block;
      width: 0.9em;
      height: 0.9em;
      vertical-align: -0.12em;
    }

    .cv-arrow svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cv-contact {
      display: flex;
      flex-direction: column;
      padding: 0.35em 0.5rem 0.4em;
      flex: 0 0 auto;
    }

    .cv-contact-item {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text);
      text-decoration: none;
      line-height: 1.4;
      cursor: none;
    }

    .cv-photo {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    @media (max-width: 900px) {
      .cv-box { top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; }
      .cv-top { padding: 0.2em 0.3rem; }
      .cv-title { font-size: 16vw; }
      .cv-photo { flex: none; height: auto; object-fit: initial; }
    }

      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 100%;
      width: auto;
      display: block;
    }

  <script>
    const dot = document.getElementById('cursor-dot');
    const label = document.getElementById('cursor-label');

    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      label.style.left = (e.clientX + 14) + 'px';
      label.style.top  = (e.clientY - 10) + 'px';
    });

    document.querySelectorAll('figure.project[data-title] a').forEach(a => {
      const title = a.closest('figure').dataset.title;
      a.addEventListener('mouseenter', () => {
        label.textContent = title;
        label.classList.add('active');
      });
      a.addEventListener('mouseleave', () => {
        label.classList.remove('active');
      });
    });

    document.querySelectorAll('nav a, .cv-entry a').forEach(a => {
      a.addEventListener('mouseenter', () => dot.classList.add('square'));
      a.addEventListener('mouseleave', () => dot.classList.remove('square'));
    });

    document.querySelectorAll('.cv-arrow').forEach(el => {
      el.addEventListener('mouseenter', () => dot.classList.add('triangle-right'));
      el.addEventListener('mouseleave', () => dot.classList.remove('triangle-right'));
    });

    document.querySelectorAll('.cv-close').forEach(el => {
      el.addEventListener('mouseenter', () => dot.classList.add('cross'));
      el.addEventListener('mouseleave', () => dot.classList.remove('cross'));
    });

    const cvInsta = document.querySelector('.cv-contact a');
    if (cvInsta) {
      cvInsta.addEventListener('mouseenter', () => dot.classList.add('plus'));
      cvInsta.addEventListener('mouseleave', () => dot.classList.remove('plus'));
    }

    document.querySelectorAll('.cv-contact [data-copy]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        dot.classList.add('square');
        label.textContent = 'copiar';
        label.classList.add('active');
      });
      el.addEventListener('mouseleave', () => {
        dot.classList.remove('square');
        label.classList.remove('active');
      });
    });

    document.querySelectorAll('figure.project[data-wip]').forEach(fig => {
      fig.addEventListener('mouseenter', () => {
        dot.classList.add('cross');
        label.textContent = fig.dataset.title;
        label.classList.add('active');
      });
      fig.addEventListener('mouseleave', () => {
        dot.classList.remove('cross');
        label.classList.remove('active');
      });
    });
  </script>

  <script>
    // CV overlay
    const cvOverlay = document.getElementById('cv-overlay');
    const cvLink = document.getElementById('cv-link');
    const cvClose = document.querySelector('.cv-close');

    function openCV(push = true) {
      cvOverlay.classList.add('open');
      document.body.classList.add('cv-open');
      if (push) history.pushState({ cv: true }, '', '#cv');
    }

    function closeCV(push = true) {
      cvOverlay.classList.remove('open');
      document.body.classList.remove('cv-open');
      if (push) history.pushState({}, '', 'index.html');
    }

    if (cvLink) cvLink.addEventListener('click', e => {
      e.preventDefault();
      openCV();
    });

    cvClose.addEventListener('click', e => {
      e.preventDefault();
      closeCV();
    });

    cvOverlay.addEventListener('click', e => {
      if (e.target === cvOverlay) closeCV();
    });

    window.addEventListener('popstate', () => {
      if (location.hash === '#cv') openCV(false);
      else closeCV(false);
    });

    if (location.hash === '#cv') openCV(false);

    document.querySelectorAll('.cv-contact [data-copy]').forEach(el => {
      const original = el.dataset.copy;
      el.addEventListener('click', () => {
        navigator.clipboard.writeText(original).catch(() => {});
        el.textContent = 'copiado';
        setTimeout(() => { el.textContent = original; }, 1500);
      });
    });
  </script>

  <script>
    // Match the close icon's visual height to the "CV" title's glyph height
    const cvTitle = document.querySelector('.cv-title');
    const cvCloseSvg = document.querySelector('.cv-close svg');
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');

    function sizeCloseIcon() {
      const cs = getComputedStyle(cvTitle);
      measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const m = measureCtx.measureText('CV');
      const visualHeight = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      cvCloseSvg.style.width = visualHeight + 'px';
      cvCloseSvg.style.height = visualHeight + 'px';
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(sizeCloseIcon);
    }
    window.addEventListener('resize', sizeCloseIcon);
    sizeCloseIcon();
  </script>

  <script>
    // Mobile: red dot animation
    const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

    function launchDot() {
      if (!isMobile()) return;

      const dot = document.createElement('div');
      dot.style.cssText = `
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        width: 24px;
        height: 24px;
        background: red;
        border-radius: 50%;
      `;
      document.body.appendChild(dot);

      // Random starting edge: 0=top, 1=right, 2=bottom, 3=left
      const edge = Math.floor(Math.random() * 4);
      const w = window.innerWidth;
      const h = window.innerHeight;

      let startX, startY, endX, endY;

      if (edge === 0) {
        startX = Math.random() * w; startY = -24;
        endX = Math.random() * w; endY = h + 24;
      } else if (edge === 1) {
        startX = w + 24; startY = Math.random() * h;
        endX = -24; endY = Math.random() * h;
      } else if (edge === 2) {
        startX = Math.random() * w; startY = h + 24;
        endX = Math.random() * w; endY = -24;
      } else {
        startX = -24; startY = Math.random() * h;
        endX = w + 24; endY = Math.random() * h;
      }

      dot.style.left = startX + 'px';
      dot.style.top = startY + 'px';

      const duration = 3500 + Math.random() * 1500; // 3.5–5s
      const start = performance.now();

      function animate(now) {
        const t = Math.min((now - start) / duration, 1);
        dot.style.left = (startX + (endX - startX) * t) + 'px';
        dot.style.top  = (startY + (endY - startY) * t) + 'px';
        if (t < 1) requestAnimationFrame(animate);
        else dot.remove();
      }

      requestAnimationFrame(animate);
    }

    // Launch every 30-33s, mobile only
    function scheduleDot() {
      const delay = 30000 + Math.random() * 3000;
      setTimeout(() => { launchDot(); scheduleDot(); }, delay);
    }
    scheduleDot();
  </script>

  <script>
    // Mobile scroll indicator
    if (window.matchMedia('(max-width: 800px)').matches) {
      const indicator = document.createElement('div');
      indicator.id = 'scroll-indicator';
      indicator.innerHTML = '<div id="si-dot"></div><div id="si-label"></div>';
      document.body.appendChild(indicator);

      const style = document.createElement('style');
      style.textContent = `
        #scroll-indicator {
          position: fixed;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          pointer-events: none;
          z-index: 9998;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }
        #si-dot {
          width: 24px;
          height: 24px;
          background: red;
          border-radius: 50%;
        }
        #si-label {
          font-family: var(--font-mono);
          font-size: 1.3rem;
          color: #000000;
          white-space: nowrap;
          text-align: center;
          mix-blend-mode: difference;
          color: #ffffff;
          min-height: 1.4em;
        }
      `;
      document.head.appendChild(style);

      const figures = document.querySelectorAll('figure.project[data-title]');
      const siLabel = document.getElementById('si-label');

      function updateIndicator() {
        const centerY = window.innerHeight / 2;
        let current = '';
        figures.forEach(fig => {
          const rect = fig.getBoundingClientRect();
          if (rect.top <= centerY && rect.bottom >= centerY) {
            current = fig.dataset.title;
          }
        });
        siLabel.textContent = current;
      }

      window.addEventListener('scroll', updateIndicator, { passive: true });
      updateIndicator();
    }
  </script>

  <script>
    (function () {
      const grid = document.querySelector('.grid');
      if (!grid) return;

      const dot = document.getElementById('cursor-dot');

      function constellation() {
        const W = grid.clientWidth;
        if (W < 600) { grid.style.opacity = '1'; if (dot) dot.classList.remove('loading'); return; } // columnas CSS en móvil

        const figures = [...grid.querySelectorAll('figure.project')];
        if (!figures.length) return;

        const COL_W = W / 5;
        const GAP = 6;

        const items = figures.map((fig, i) => {
          const img = fig.querySelector('img.thumb');
          let aspect = 130 / 100;
          if (img && img.naturalWidth && img.naturalHeight) {
            aspect = img.naturalHeight / img.naturalWidth;
          }
          return { fig, w: COL_W, h: COL_W * aspect, i };
        });

        const COLS = 5;
        const AVG_H = items.reduce((s, it) => s + it.h, 0) / items.length;
        const ROW_H = AVG_H * 1.8 + GAP * 4;
        const JX = COL_W * 3.0;
        const JY = ROW_H * 1.2;

        const placed = [];

        function overlaps(ax, ay, aw, ah) {
          for (const p of placed) {
            if (ax + aw + GAP > p.x && ax < p.x + p.w + GAP &&
                ay + ah + GAP > p.y && ay < p.y + p.h + GAP) return true;
          }
          return false;
        }

        items.forEach(({ fig, w, h, i }) => {
          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const baseX = col * (W / COLS) + (W / COLS - w) / 2;
          const baseY = row * ROW_H;

          let bx = baseX, by = baseY, found = false;

          for (let t = 0; t < 150; t++) {
            const s = Math.min(t * 0.12 + 1, 3.5);
            const rx = (Math.random() * 2 - 1) * JX * s;
            const ry = (Math.random() * 2 - 1) * JY * s;
            const cx = Math.max(GAP, Math.min(W - w - GAP, baseX + rx));
            const cy = Math.max(GAP, baseY + ry);
            if (!overlaps(cx, cy, w, h)) { bx = cx; by = cy; found = true; break; }
          }

          if (!found) {
            const maxY = placed.reduce((m, p) => Math.max(m, p.y + p.h), 0);
            bx = Math.max(GAP, Math.min(W - w - GAP, baseX));
            by = maxY + GAP;
          }

          placed.push({ x: bx, y: by, w, h });
          fig.style.position = 'absolute';
          fig.style.left   = Math.round(bx) + 'px';
          fig.style.top    = Math.round(by) + 'px';
          fig.style.width  = Math.round(w)  + 'px';
          fig.style.margin = '0';
        });

        const totalH = placed.reduce((m, p) => Math.max(m, p.y + p.h), 0);
        grid.style.position = 'relative';
        grid.style.height   = Math.round(totalH + 32) + 'px';
        grid.style.opacity  = '1';
        if (dot) dot.classList.remove('loading');
      }

      // Esperar a que carguen las imágenes antes de calcular posiciones
      const imgs = [...grid.querySelectorAll('img.thumb')];
      const pending = imgs.filter(img => !img.complete);
      if (pending.length === 0) {
        constellation();
      } else {
        if (dot) dot.classList.add('loading');
        let done = 0;
        const check = () => { if (++done >= pending.length) constellation(); };
        pending.forEach(img => {
          img.addEventListener('load',  check, { once: true });
          img.addEventListener('error', check, { once: true });
        });
      }

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          grid.querySelectorAll('figure.project').forEach(f => {
            f.style.position = '';
            f.style.left = '';
            f.style.top  = '';
            f.style.width = '';
            f.style.margin = '';
          });
          grid.style.position = '';
          grid.style.height   = '';
          grid.style.opacity  = '0';
constellation();
        }, 200);
      });
    })();
  </script>
  <script src="/js/nav5.js"></script>
</body>
