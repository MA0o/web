  <title>Mateo — Portfolio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'Courier New', Courier, monospace;
      --nav-size: 0.85rem;
      --caption-size: 0.72rem;
      --gutter: 0.3rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      padding: 0.25rem 0.6rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.3;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      width: 100%;
    }

    nav a {
      display: block;
      color: #000000;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* MAIN */
    main {
      padding-top: 8rem;
      padding-left: 12%;
      padding-right: 1.8rem;
      padding-bottom: 4rem;
    }

    /* MASONRY GRID */
    .grid {
      columns: 5;
      column-gap: var(--gutter);
    }

    /* PROJECT ITEM */
    figure.project {
      break-inside: avoid;
      margin-bottom: var(--gutter);
      display: block;
    }

    figure.project a {
      display: block;
      text-decoration: none;
      color: var(--text);
    }

    figure.project img {
      display: block;
      width: 100%;
      height: auto;
      transition: filter 0.5s ease;
    }

    figure.project a:hover img {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
      mix-blend-mode: difference;
    }

    figcaption {
      font-size: var(--caption-size);
      padding: 0.3rem 0 0 0;
      letter-spacing: 0.02em;
      color: #000000;
    }

    /* PLACEHOLDER — imagen aún no subida */
    .img-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background-color: #e0e0e0;
      display: block;
      transition: filter 0.5s ease;
    }

    figure.project a:hover .img-placeholder {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
    }

    /* PLACEHOLDER decorativo (sin proyecto) */
    .deco-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background-color: #f0f0f0;
    }

    /* RESPONSIVE */
    @media (max-width: 1100px) {
      .grid { columns: 4; }
    }

    @media (max-width: 800px) {
      .grid { columns: 3; }
      main { padding-left: 1.8rem; padding-top: 10rem; }
    }

    @media (max-width: 500px) {
      .grid { columns: 1; }
    }
  </style>
</head>
