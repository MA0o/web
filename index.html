  <title>Mateo — Portfolio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #000000;
      --text: #ffffff;
      --caption: #ffffff;
      --font-mono: 'Courier New', Courier, monospace;
      --nav-size: 0.85rem;
      --caption-size: 0.72rem;
      --gutter: 0.3rem;
      --columns: 5;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      padding: 1.6rem 1.8rem;
      z-index: 100;
      line-height: 1.7;
      font-size: var(--nav-size);
    }

    nav a {
      display: block;
      color: var(--text);
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* GRID WRAPPER */
    main {
      padding-top: 8.5rem;
      padding-left: calc(1.8rem + 9ch); /* offset for nav column */
      padding-right: 1.8rem;
      padding-bottom: 4rem;
    }

    /* MASONRY GRID — CSS columns */
    .grid {
      columns: var(--columns);
      column-gap: var(--gutter);
    }

    /* PROJECT ITEM */
    .project {
      break-inside: avoid;
      margin-bottom: var(--gutter);
      position: relative;
      display: block;
      cursor: pointer;
    }

    .project img {
      display: block;
      width: 100%;
      height: auto;
      transition: filter 0.5s ease;
    }

    .project:hover img {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
      mix-blend-mode: difference;
    }

    /* Items without link (decorative/zoomable) */
    .project.no-link {
      cursor: default;
    }

    figcaption {
      font-family: var(--font-mono);
      font-size: var(--caption-size);
      color: var(--caption);
      padding: 0.3rem 0 0 0;
      letter-spacing: 0.02em;
    }

    /* PLACEHOLDER for missing images */
    .placeholder {
      background-color: #111;
      width: 100%;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: #444;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      :root { --columns: 3; }
      main {
        padding-left: 1.8rem;
        padding-top: 10rem;
      }
    }

    @media (max-width: 560px) {
      :root { --columns: 1; }
    }
  </style>
</head>
