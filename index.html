  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'IBM Plex Mono', 'Courier New', Courier, monospace;
      --nav-size: 1rem;
      --gutter: 0.3rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.25rem 0.6rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.1;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
    }

    nav a {
      display: block;
      color: #000000;
      text-decoration: none;
    }

    nav a:hover { text-decoration: underline; }

    /* MAIN */
    main {
      padding-top: 8rem;
      padding-left: 12%;
      padding-right: 1.8rem;
      padding-bottom: 4rem;
    }

    /* GRID */
    .grid {
      columns: 5;
      column-gap: var(--gutter);
    }

    figure.project {
      break-inside: avoid;
      margin-bottom: var(--gutter);
      display: block;
    }

    figure.project a {
      display: block;
      text-decoration: none;
    }

    .thumb {
      display: block;
      width: 100%;
      background-color: #cccccc;
      transition: filter 0.5s ease;
    }

    figure.project a:hover .thumb {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
    }

    .deco { width: 100%; height: 220px; background: #e0e0e0; }

    /* RESPONSIVE */
    @media (max-width: 1100px) { .grid { columns: 4; } }
    @media (max-width: 800px) {
      .grid { columns: 3; }
      main { padding-left: 0; padding-right: 0; padding-top: 10rem; }
      nav { font-size: 1.3rem; }
    }
    @media (max-width: 500px) { .grid { columns: 1; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #cursor-label {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-family: var(--font-mono);
      font-size: 1rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    #cursor-label.active { opacity: 1; }
  </style>

  <script>
    const dot = document.getElementById('cursor-dot');
    const label = document.getElementById('cursor-label');

    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      label.style.left = (e.clientX + 14) + 'px';
      label.style.top = e.clientY + 'px';
    });

    document.querySelectorAll('figure.project[data-title] a').forEach(a => {
      const title = a.closest('figure').dataset.title;
      a.addEventListener('mouseenter', () => {
        label.textContent = title;
        label.classList.add('active');
      });
      a.addEventListener('mouseleave', () => {
        label.classList.remove('active');
      });
    });
  </script>


  <script>
    // Mobile: red dot animation
    const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

    function launchDot() {
      if (!isMobile()) return;

      const dot = document.createElement('div');
      dot.style.cssText = `
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        width: 24px;
        height: 24px;
        background: red;
        border-radius: 50%;
      `;
      document.body.appendChild(dot);

      // Random starting edge: 0=top, 1=right, 2=bottom, 3=left
      const edge = Math.floor(Math.random() * 4);
      const w = window.innerWidth;
      const h = window.innerHeight;

      let startX, startY, endX, endY;

      if (edge === 0) {
        startX = Math.random() * w; startY = -24;
        endX = Math.random() * w; endY = h + 24;
      } else if (edge === 1) {
        startX = w + 24; startY = Math.random() * h;
        endX = -24; endY = Math.random() * h;
      } else if (edge === 2) {
        startX = Math.random() * w; startY = h + 24;
        endX = Math.random() * w; endY = -24;
      } else {
        startX = -24; startY = Math.random() * h;
        endX = w + 24; endY = Math.random() * h;
      }

      dot.style.left = startX + 'px';
      dot.style.top = startY + 'px';

      const duration = 3500 + Math.random() * 1500; // 3.5–5s
      const start = performance.now();

      function animate(now) {
        const t = Math.min((now - start) / duration, 1);
        dot.style.left = (startX + (endX - startX) * t) + 'px';
        dot.style.top  = (startY + (endY - startY) * t) + 'px';
        if (t < 1) requestAnimationFrame(animate);
        else dot.remove();
      }

      requestAnimationFrame(animate);
    }

    // Launch every 30-33s, mobile only
    function scheduleDot() {
      const delay = 30000 + Math.random() * 3000;
      setTimeout(() => { launchDot(); scheduleDot(); }, delay);
    }
    scheduleDot();
  </script>

  <script>
    // Mobile scroll indicator
    if (window.matchMedia('(max-width: 800px)').matches) {
      const indicator = document.createElement('div');
      indicator.id = 'scroll-indicator';
      indicator.innerHTML = '<div id="si-dot"></div><div id="si-label"></div>';
      document.body.appendChild(indicator);

      const style = document.createElement('style');
      style.textContent = `
        #scroll-indicator {
          position: fixed;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          pointer-events: none;
          z-index: 9998;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }
        #si-dot {
          width: 24px;
          height: 24px;
          background: red;
          border-radius: 50%;
        }
        #si-label {
          font-family: var(--font-mono);
          font-size: 1.3rem;
          color: #000000;
          white-space: nowrap;
          text-align: center;
          mix-blend-mode: difference;
          color: #ffffff;
          min-height: 1.4em;
        }
      `;
      document.head.appendChild(style);

      const figures = document.querySelectorAll('figure.project[data-title]');
      const siLabel = document.getElementById('si-label');

      function updateIndicator() {
        const centerY = window.innerHeight / 2;
        let current = '';
        figures.forEach(fig => {
          const rect = fig.getBoundingClientRect();
          if (rect.top <= centerY && rect.bottom >= centerY) {
            current = fig.dataset.title;
          }
        });
        siLabel.textContent = current;
      }

      window.addEventListener('scroll', updateIndicator, { passive: true });
      updateIndicator();
    }
  </script>
