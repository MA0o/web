  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'Courier New', Courier, monospace;
      --nav-size: 1.2rem;
      --caption-size: 0.72rem;
      --gutter: 0.3rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      padding: 0.25rem 0.6rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.3;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
      width: 100%;
    }

    nav a {
      display: block;
      color: #000000;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* MAIN */
    main {
      padding-top: 8rem;
      padding-left: 12%;
      padding-right: 1.8rem;
      padding-bottom: 4rem;
    }

    /* MASONRY GRID */
    .grid {
      columns: 5;
      column-gap: var(--gutter);
    }

    /* PROJECT ITEM */
    figure.project {
      break-inside: avoid;
      margin-bottom: var(--gutter);
      display: block;
    }

    figure.project a {
      display: block;
      text-decoration: none;
      color: var(--text);
    }

    figure.project img,
    figure.project .thumb {
      display: block;
      width: 100%;
      transition: filter 0.5s ease;
    }

    figure.project img {
      height: auto;
    }

    figure.project a:hover img,
    figure.project a:hover .thumb {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
    }

    figcaption {
      font-size: var(--caption-size);
      padding: 0.3rem 0 0 0;
      letter-spacing: 0.02em;
      color: #000000;
    }

    /* PLACEHOLDER — imagen aún no subida */
    .img-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background-color: #e0e0e0;
      display: block;
      transition: filter 0.5s ease;
    }

    

    /* PLACEHOLDER decorativo (sin proyecto) */
    .deco-placeholder {
      width: 100%;
      height: 200px;
      background-color: #f0f0f0;
    }

    /* RESPONSIVE */
    @media (max-width: 1100px) {
      .grid { columns: 4; }
    }

    @media (max-width: 800px) {
      .grid { columns: 3; }
      main { padding-left: 0.6rem; padding-right: 0.6rem; padding-top: 10rem; }
    }

    @media (max-width: 500px) {
      .grid { columns: 1; }
    }

    /* CUSTOM CURSOR */
    * { cursor: none; }

    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-family: var(--font-mono);
      font-weight: bold;
      font-size: 0.85rem;
      color: #ffffff;
      white-space: nowrap;
      -webkit-text-fill-color: #ffffff;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.15s ease;
      mix-blend-mode: difference;
    }

    #cursor.active {
      opacity: 1;
    }

  </style>

  <div id="cursor"></div>

  <script>
    const cursor = document.getElementById('cursor');
    const projects = document.querySelectorAll('figure.project a');

    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    projects.forEach(a => {
      const title = a.querySelector('figcaption') ? a.querySelector('figcaption').textContent : '';
      a.addEventListener('mouseenter', () => {
        cursor.textContent = title;
        cursor.classList.add('active');
      });
      a.addEventListener('mouseleave', () => {
        cursor.classList.remove('active');
        cursor.textContent = '';
      });
    });
  </script>
