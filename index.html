<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mateo — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --font-mono: 'Courier New', Courier, monospace;
      --nav-size: 1.2rem;
      --gutter: 0.3rem;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 0.25rem 0.6rem;
      z-index: 100;
      font-size: var(--nav-size);
      line-height: 1.3;
      mix-blend-mode: difference;
      background: #ffffff;
      color: #000000;
    }

    nav a {
      display: block;
      color: #000000;
      text-decoration: none;
    }

    nav a:hover { text-decoration: underline; }

    /* MAIN */
    main {
      padding-top: 8rem;
      padding-left: 12%;
      padding-right: 1.8rem;
      padding-bottom: 4rem;
    }

    /* GRID */
    .grid {
      columns: 5;
      column-gap: var(--gutter);
    }

    figure.project {
      break-inside: avoid;
      margin-bottom: var(--gutter);
      display: block;
    }

    figure.project a {
      display: block;
      text-decoration: none;
    }

    .thumb {
      display: block;
      width: 100%;
      background-color: #cccccc;
      transition: filter 0.5s ease;
    }

    figure.project a:hover .thumb {
      filter: invert(1) brightness(1.5) hue-rotate(180deg);
    }

    .deco { width: 100%; height: 220px; background: #e0e0e0; }

    /* RESPONSIVE */
    @media (max-width: 1100px) { .grid { columns: 4; } }
    @media (max-width: 800px) {
      .grid { columns: 3; }
      main { padding-left: 0.6rem; padding-right: 0.6rem; padding-top: 10rem; }
    }
    @media (max-width: 500px) { .grid { columns: 1; } }

    /* CURSOR */
    * { cursor: none; }

    #cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #cursor-label {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      color: #ffffff;
      mix-blend-mode: difference;
      white-space: nowrap;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    #cursor-label.active { opacity: 1; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">1. Proyectos</a>
    <a href="about.html">2. About</a>
    <a href="cv.html">3. CV</a>
    <a href="contact.html">4. Contact</a>
  </nav>

  <main>
    <div class="grid">

      <figure class="project" data-title="USM Haller-T">
        <a href="proyectos/haller-t.html">

        </a>
      </figure>

      <figure class="project" data-title="TRABA">
        <a href="proyectos/traba.html">

        </a>
      </figure>

      <figure class="project" data-title="NAPBUF">
        <a href="proyectos/napbuf.html">
          <div class="thumb" style="height:420px"></div>
        </a>
      </figure>

      <figure class="project" data-title="DIARIO DE CONQUISTA">
        <a href="proyectos/conquista.html">
          <div class="thumb" style="height:260px"></div>
        </a>
      </figure>

      <figure class="project">
        <div class="deco"></div>
      </figure>

      <figure class="project" data-title="innotable">
        <a href="proyectos/innotable.html">
          <div class="thumb" style="height:480px"></div>
        </a>
      </figure>

      <figure class="project" data-title="1x1">
        <a href="proyectos/1x1.html">
          <div class="thumb" style="height:340px"></div>
        </a>
      </figure>

      <figure class="project" data-title="MMMM">
        <a href="proyectos/mmmm.html">
          <div class="thumb" style="height:560px"></div>
        </a>
      </figure>

      <figure class="project" data-title="STINA">
        <a href="proyectos/stina.html">
          <div class="thumb" style="height:290px"></div>
        </a>
      </figure>

      <figure class="project" data-title="LA PLANÈTE SAUVAGE">
        <a href="proyectos/sauvage.html">
          <div class="thumb" style="height:450px"></div>
        </a>
      </figure>

      <figure class="project" data-title="f/00">
        <a href="proyectos/f00-low.html">
          <div class="thumb" style="height:310px"></div>
        </a>
      </figure>

      <figure class="project" data-title="FLAIX">
        <a href="proyectos/flaix.html">
          <div class="thumb" style="height:520px"></div>
        </a>
      </figure>

      <figure class="project">

      </figure>

      <figure class="project" data-title="POLLO AL LIMÓN">

      </figure>

      <figure class="project" data-title="caramelo">
        <a href="proyectos/caramelo.html">
          <div class="thumb" style="height:400px"></div>
        </a>
      </figure>

      <figure class="project">
        <div class="deco"></div>
      </figure>

      <figure class="project" data-title="ASE D'OR">
        <a href="proyectos/ase-dor.html">
          <div class="thumb" style="height:380px"></div>
        </a>
      </figure>

    </div>
  </main>

  <div id="cursor-dot"></div>
  <div id="cursor-label"></div>

  <script>
    const dot = document.getElementById('cursor-dot');
    const label = document.getElementById('cursor-label');

    document.addEventListener('mousemove', e => {
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      label.style.left = (e.clientX + 14) + 'px';
      label.style.top = e.clientY + 'px';
    });

    document.querySelectorAll('figure.project[data-title] a').forEach(a => {
      const title = a.closest('figure').dataset.title;
      a.addEventListener('mouseenter', () => {
        label.textContent = title;
        label.classList.add('active');
      });
      a.addEventListener('mouseleave', () => {
        label.classList.remove('active');
      });
    });
  </script>

</body>
</html>
